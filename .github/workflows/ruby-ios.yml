name: Ruby for iOS

# The app build (ios.yml) builds and caches Ruby.xcframework itself; run this by hand to
# smoke-test a new Ruby build in the simulator.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.1"
      - name: Build Ruby.xcframework
        run: native/ruby-ios/build.sh native/ruby-ios/out
      - name: Smoke test in the iOS Simulator
        run: |
          set -x
          FW=native/ruby-ios/out/Ruby.xcframework
          SIM=$(ls -d $FW/ios-arm64-simulator)
          xcrun --sdk iphonesimulator clang -target arm64-apple-ios16.0-simulator \
            -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -I "$SIM/Headers" native/ruby-ios/smoke.c "$SIM"/*.a \
            -framework CoreFoundation -lz -o smoke
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')][-1])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          perl -e 'alarm 300; exec @ARGV' xcrun simctl spawn "$UDID" "$PWD/smoke" 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ruby.xcframework
          path: native/ruby-ios/out
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ruby-ios-logs
          path: ruby-ios-build/*.log
