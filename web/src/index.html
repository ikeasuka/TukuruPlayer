<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TukuruPlayer</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #screen { display: block; background: #000; }
  #screen.pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }
  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); font-family: -apple-system, "Hiragino Sans", sans-serif; color: #fff;
  }
  #overlay .box {
    max-width: min(88vw, 640px); max-height: 80vh; overflow: auto; background: #1d1f27;
    border: 1px solid #3b3f4e; border-radius: 12px; padding: 18px 20px; box-sizing: border-box;
  }
  #overlay h2 { margin: 0 0 10px; font-size: 17px; }
  #overlay pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; line-height: 1.45; margin: 0; color: #d7dae3; }
  #overlay .hint { margin-top: 14px; font-size: 12px; color: #9aa0b3; text-align: right; }
  #loading {
    position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; color: #9aa0b3;
    font: 13px -apple-system, "Hiragino Sans", sans-serif;
  }
  #fps { position: absolute; left: 6px; top: 6px; color: #0f0; font: 11px Menlo, monospace; display: none;
    background: rgba(0,0,0,0.5); padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" width="544" height="416"></canvas></div>
<div id="loading">読み込み中…</div>
<div id="fps"></div>
<div id="overlay"><div class="box"><h2 id="ov-title"></h2><pre id="ov-body"></pre><div class="hint" id="ov-hint"></div></div></div>
<script src="app.js"></script>
</body>
</html>
